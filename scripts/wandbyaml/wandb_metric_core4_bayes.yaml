program: scripts/wandb_metric_core4_trial.py
method: bayes
run_cap: 120
metric:
  name: sweep/objective_metric_core4_v1
  goal: maximize
parameters:
  atom_power:
    min: 1.05
    max: 1.20
  temperature:
    min: 0.55
    max: 0.90
  transition_steepness:
    min: 4.0
    max: 12.0
  radial_stretch:
    min: 6.0
    max: 12.0
  void_decay_scale:
    min: 6.0
    max: 14.0
  void_decay_power:
    min: 1.0
    max: 1.8
  attractor_gamma:
    min: 6.0
    max: 30.0
  attractor_k_nearest:
    values: [1, 2, 3]
command:
  - ${env}
  - ${interpreter}
  - ${program}
  - ${args}
  - --base_config
  - configs/run_geometry_default_soft_no_tunnels_v2.yaml
  - --epochs
  - "40"
  - --train_seed
  - "13"
  - --runs_root
  - outputs/metric_core4_sweep
  - --analysis_root
  - results/metric_core4_sweep
  - --probe_points
  - "2048"
  - --probe_bbox_scale
  - "2.5"
  - --probe_seed
  - "13"
  - --wandb_group
  - metric_core4_bayes
  - --wandb_name_mode
  - auto
