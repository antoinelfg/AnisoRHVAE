version: 1
created_at: "2026-02-12"
defaults:
  cache_root: assets/cache/models
  alias_root: outputs/reference_models
models:
  - model_id: aniso
    model_family: rhvae_aniso
    alias_path: outputs/reference_models/aniso
    required_files:
      - rhvae_model.pt
      - rhvae_metric.pt
    local_candidates:
      - outputs/reference_models/4K
      - outputs/pythae_rhvae_baseline/2026-02-09_18-16-00
    wandb_refs:
      # Optional format: entity/project/artifact_name:version
      - ""
    train_if_missing: false

  - model_id: rhvae_standard
    model_family: rhvae_standard
    alias_path: outputs/reference_models/rhvae_standard
    required_files:
      - rhvae_model.pt
      - rhvae_metric.pt
    local_candidates:
      - outputs/pythae_rhvae_baseline/2026-02-09_15-04-06
    wandb_refs:
      - ""
    train_if_missing: false

  - model_id: vanilla_vae
    model_family: vanilla_vae
    alias_path: outputs/reference_models/vanilla_vae
    required_files:
      - model.pt
      - config.json
      - train_data.pt
      - metrics.json
    local_candidates: []
    wandb_refs:
      - ""
    train_if_missing: true

  - model_id: ebm_conformal
    model_family: ebm_conformal
    alias_path: outputs/reference_models/ebm_conformal
    required_files:
      - encoder.pt
      - decoder.pt
      - ebm.pt
      - config.json
      - train_data.pt
      - metrics.json
    local_candidates: []
    wandb_refs:
      - ""
    train_if_missing: true
