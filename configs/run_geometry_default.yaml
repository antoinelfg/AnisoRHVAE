# Default GeometryRHVAE configuration
# These are the tested parameters that work well for the metric and RHVAE

# === TRAINING ===
epochs: 100
batch_size: 64
lr: 0.0005
seed: 42

# === DATA ===
num_sequences: 200
max_frames: 3000
frame_mode: t0

# === MODEL ARCHITECTURE ===
latent_dim: 2
n_centroids: 100
rhvae_variant: geometry

# === METRIC CONFIGURATION ===
use_attractor: true
kernel_type: mahalanobis
atom_norm: trace
atom_power: 1.0
kernel_power: 1.0
precision_jitter: 0.01

# === TEMPERATURE & REGULARIZATION ===
temperature: 0.8
regularization: 0.8

# === VOID/MANIFOLD BOUNDARY ===
void_threshold: 1.2
void_weight_threshold: -1.0
transition_steepness: 12.0
radial_stretch: 8.0

# === VOID DECAY (how fast metric changes in void) ===
void_decay_type: invquad
void_decay_scale: 4.5
void_decay_power: 1.5
void_decay_softplus_k: 5.0

# === VOID SPECTRAL SHAPING (det-preserving, optional) ===
void_eigshape_mode: none
void_eigshape_alpha_min: 1.0
void_eigshape_power: -1.0
void_eigshape_eig_floor: 1e-8

# === ATTRACTOR CONFIGURATION ===
attractor_metric: mahalanobis
attractor_smoothness: soft
attractor_use_det: true
attractor_k_nearest: -1
attractor_gamma: 5.0
attractor_bias_energy: 18.0
