# Baseline RHVAE (original) configuration - 100 epochs
# No anisotropy, no attractor; uses isotropic kernel and standard RHVAE variant.

# === TRAINING ===
epochs: 100
batch_size: 64
lr: 0.001
seed: 42

# === DATA ===
num_sequences: 200
max_frames: 3000
frame_mode: t0

# === MODEL ARCHITECTURE ===
latent_dim: 2
n_centroids: 100
rhvae_variant: standard

# === METRIC (BASELINE) ===
kernel_type: isotropic

# === TEMPERATURE & REGULARIZATION (original RHVAE defaults) ===
temperature: 0.5
regularization: 0.01

# === ANALYSIS / SAMPLING ===
analysis_rhmc_sampler: riemannian
skip_sampling_diagnostics: true
sampling_fid_samples: 200
sampling_fid_samplers: [gaussian, volume]
sampling_n_starts: 12
sampling_n_interp_pairs: 4
sampling_quality_samples: 200
sampling_n_chains: 4
sampling_chain_length: 100
