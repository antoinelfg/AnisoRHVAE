# Reproduction config from the selected 4K trial (seed 13) for pythae RHVAE geometry training.

# === TRAINING ===
epochs: 40
batch_size: 64
lr: 0.0005
seed: 13

# === OUTPUT ===
output_dir: outputs/metric_core4_sweep

# === DATA ===
num_sequences: 200
max_frames: 3000
frame_mode: t0

# === MODEL ===
rhvae_variant: geometry
latent_dim: 2
n_centroids: 100

# === METRIC ===
use_attractor: true
kernel_type: mahalanobis
temperature: 0.7960961952783896
regularization: 0.6
atom_norm: trace
atom_power: 1.0959864113997024
kernel_power: 1.0
precision_jitter: 0.01

# === ATTRACTOR / VOID ===
attractor_smoothness: soft
attractor_metric: mahalanobis
attractor_use_det: true
attractor_gamma: 7.624554217806352
attractor_k_nearest: 1
attractor_bias_energy: 18.0

void_threshold: 1.2
void_weight_threshold: -1.0
void_decay_type: invquad
void_decay_scale: 8.87131893173153
void_decay_power: 1.7447710342008058
void_decay_softplus_k: 5.0
radial_stretch: 9.252860449508804
transition_steepness: 7.276725930229776

# === W&B ===
wandb_group: metric_core4_bayes
wandb_name_mode: auto

# === ANALYSIS / SAMPLING ===
analysis_rhmc_sampler: volume
skip_sampling_diagnostics: true
