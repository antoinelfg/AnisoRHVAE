epochs: 100
batch_size: 64
lr: 0.0005                # Lower LR for stability
seed: 42
num_sequences: 200
max_frames: 3000
frame_mode: t0
latent_dim: 2
n_centroids: 100
rhvae_variant: geometry
use_attractor: true
kernel_type: mahalanobis
atom_norm: trace
atom_power: 1.0
kernel_power: 1.0
precision_jitter: 0.01    # Higher jitter for numerical stability
temperature: 0.8          # Close to original 1.0 for stability
regularization: 0.8       # Close to original for stability

# === SLIGHTLY TIGHTER VOID PENALTY (conservative) ===
void_threshold: 0.45      # Very close to original 0.5
void_weight_threshold: -1.0
transition_steepness: 25.0  # Same as original
radial_stretch: 7.0       # Same as original

# === SLIGHTLY STRONGER VOID DECAY (conservative) ===
void_decay_type: invquad
void_decay_scale: 3.5     # Slightly tighter than 4.0
void_decay_power: 2.0     # Slightly stronger than 1.8
void_decay_softplus_k: 5.0  # Same as original

# === SLIGHTLY STRONGER ATTRACTOR (conservative) ===
attractor_metric: euclidean
attractor_smoothness: soft
attractor_use_det: true
attractor_k_nearest: 15   # Same as original
attractor_gamma: 5.0      # Slightly stronger than 4.375
attractor_bias_energy: 18.0  # Slightly stronger than 15.0

wandb_name_mode: auto
rhmc_integrator: explicit
rhmc_fp_steps: 6
rhmc_fp_damping: 0.5
analysis_rhmc_sampler: riemannian

# Sampling diagnostics with faster defaults
skip_sampling_diagnostics: false
sampling_fid_samples: 200
sampling_fid_samplers: [gaussian, riemannian, geodesic]
sampling_n_starts: 12
sampling_n_interp_pairs: 4
sampling_quality_samples: 200
sampling_n_chains: 4
sampling_chain_length: 100
