hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: MULTIRUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=MULTIRUN
    task:
    - dataset.subset_n=5000
    - model=aniso_core4
  job:
    name: run_experiment
    chdir: null
    override_dirname: dataset.subset_n=5000,model=aniso_core4
    id: ???
    num: ???
    config_name: config
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /scratch/alaforgu/longitudinal_experiments/AnisoRHVAE
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /scratch/alaforgu/longitudinal_experiments/AnisoRHVAE/conf
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: ???
    choices:
      sampler: volume_riemannian
      model: aniso_core4
      dataset: rotmnist
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
dataset:
  name: rotmnist
  subset_n: 5000
  n_centroids: 50
  max_centroids: 50
  training_base_config: configs/run_geometry_aniso_core4_n50_sampler_strict.yaml
model:
  name: aniso_core4
  geometry_overrides:
    use_attractor: true
    attractor_use_det: true
    void_decay_type: invquad
sampler:
  name: volume_riemannian
  script_args:
    sampler_name: volume_riemannian
    use_dual_metric: false
    atom_scale: 100.0
    volume_power: 2.0
    radial_prior_weight: 0.1
    steps: 500
    n_lf_inner: 10
    eps: 0.05
    adaptive_dual_step: true
    adaptive_max_dual_displacement: 0.05
    fp_steps: 15
    void_eigshape_mode: none
seed: 13
wandb:
  project: anisorhvae-neurips-benchmark
  entity: null
  mode: online
  tags: []
output_root: results/neurips_experiments
reuse_policy: reuse_latest
python_bin: python
